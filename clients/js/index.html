<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Survey — Plain JS</title>
    <!-- survey-core ships no @font-face of its own: the theme only names
         "Open Sans" (weights 400/600/700) and the host page supplies the faces. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..700&display=swap">
    <style>
      html, body { margin: 0; }
      /* Flex column: the bar keeps its own height, the survey gets the rest
         and scrolls internally. overflow:hidden prevents a second page-level
         scrollbar of the bar's height. */
      main { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    </style>
  </head>
  <body>
    <main id="root"><p>Connecting to the room…</p></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
