<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Survey</title>
  <!-- survey-core ships no @font-face of its own: the theme only names
       "Open Sans" (weights 400/600/700) and the host page supplies the faces. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..700&display=swap">
  <style>
    /* fitToContainer gives the survey root height:100%; it needs a definite
       height all the way up to <html> to resolve against. */
    html, body { height: 100%; }
    #root { height: 100%; }
    body.type_embedded .sd-title.sd-container-modern__title {
      display: none;
    }
  </style>
</head>

<body style="background-color: #EDF9F7; padding: 0; margin: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
