<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Collaborative Survey — Angular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- survey-core ships no @font-face of its own: the theme only names
       "Open Sans" (weights 400/600/700) and the host page supplies the faces. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..700&display=swap">
  <!-- Loaded as verbatim assets, not through angular.json "styles": the
       Angular 12 postcss pipeline chokes on survey-core's modern CSS. -->
  <link rel="stylesheet" href="survey-core.min.css">
  <link rel="stylesheet" href="presenceSync.css">
  <style>
    html, body { margin: 0; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
